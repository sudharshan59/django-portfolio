name: Django CI/CD - AWS EC2

on:
  pull_request:
    branches:
      - dev

  push:
    branches:
      - dev

jobs:

  # =========================
  # CI - TEST
  # =========================
  test:
    name: Django CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: |
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test


  # =========================
  # CD - DEPLOY TO AWS EC2
  # =========================
  deploy:
    name: Deploy to AWS EC2
    needs: test

    # Deploy ONLY after code is pushed/merged into dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            set -e

            echo "======================================"
            echo "Starting AWS deployment..."
            echo "======================================"

            cd /home/ec2-user/django-portfolio

            echo "Fetching latest dev..."
            git fetch origin dev

            echo "Resetting EC2 to origin/dev..."
            git reset --hard origin/dev

            echo "Activating virtual environment..."
            source venv/bin/activate

            echo "Installing dependencies..."
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            echo "Running migrations..."
            python manage.py migrate --noinput

            echo "Collecting static files..."
            python manage.py collectstatic --noinput

            echo "Restarting Django..."
            sudo systemctl restart django

            echo "Checking Django service..."
            sudo systemctl is-active --quiet django

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"